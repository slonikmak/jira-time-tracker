}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;!-- UX proposal: compare split workspace, log-first layout, and task groups. Demo data and in-memory interactions only. --&gt;
&lt;style&gt;
#jt-ux {
  --jt-bg: light-dark(#f7f8fc,#191c24); --jt-surface: light-dark(#ffffff,#242833);
  --jt-text: light-dark(#232838,#edf0f7); --jt-muted: light-dark(#667086,#acb5c9);
  --jt-line: light-dark(#e1e5ed,#3c4352); --jt-hover: light-dark(#f0f2f8,#2d3341);
  --jt-primary: light-dark(#5156c8,#bfc0ff); --jt-on-primary: light-dark(#ffffff,#22234e);
  --jt-selected: light-dark(#efefff,#34364f); --jt-green: light-dark(#247858,#8fddbc);
  --jt-green-bg: light-dark(#eaf6f0,#203d35); --jt-warn: light-dark(#8e551d,#f0c68c);
  --jt-warn-bg: light-dark(#fff4e5,#453522); --jt-error: light-dark(#b73748,#ffabb6);
  --jt-one: light-dark(#b8baf1,#676ab0); --jt-two: light-dark(#9dcfc4,#488678);
  --jt-existing: light-dark(#c6cbd7,#737d92); --jt-break: light-dark(#e9ecf2,#333b48);
  --jt-pad: 14px;
  color:var(--jt-text); background:var(--jt-bg); font:14px/1.45 &quot;Segoe UI&quot;,sans-serif;
  border:1px solid var(--jt-line); border-radius:12px; overflow:clip; position:relative;
  width:100%; box-sizing:border-box; text-align:left;
}
#jt-ux *,#jt-ux *:before,#jt-ux *:after{box-sizing:border-box}
#jt-ux button,#jt-ux input,#jt-ux select,#jt-ux textarea{font:inherit}
#jt-ux button{cursor:pointer}
#jt-ux button:disabled{cursor:default;opacity:.5}
#jt-ux h2,#jt-ux h3,#jt-ux p{margin:0}
#jt-ux h2{font-size:22px;font-weight:500;letter-spacing:-.4px}
#jt-ux h3{font-size:14px;font-weight:500}
#jt-ux strong{font-weight:500}
#jt-ux svg{width:16px;height:16px;flex-shrink:0}
#jt-ux .jt-titlebar{display:flex;align-items:center;gap:9px;padding:10px 16px;background:var(--jt-surface);font-size:12px;border-bottom:1px solid var(--jt-line)}
#jt-ux .jt-logo{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--jt-primary);color:var(--jt-on-primary)}
#jt-ux .jt-demo{color:var(--jt-muted);border-left:1px solid var(--jt-line);padding-left:9px}
#jt-ux .jt-window-marks{margin-left:auto;display:flex;gap:22px;color:var(--jt-muted)}
#jt-ux .jt-nav{display:flex;align-items:center;gap:6px;padding:10px 18px;background:var(--jt-surface);border-bottom:1px solid var(--jt-line);flex-wrap:wrap}
#jt-ux .jt-tab,#jt-ux .jt-button,#jt-ux .jt-icon{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;background:transparent;color:var(--jt-text);border-radius:7px;min-height:34px;padding:6px 11px;white-space:nowrap;font-weight:500}
#jt-ux .jt-tab[aria-selected=true]{background:var(--jt-selected);color:var(--jt-primary)}
#jt-ux .jt-button{border-color:var(--jt-line);background:var(--jt-surface)}
#jt-ux .jt-button:hover,#jt-ux .jt-tab:hover,#jt-ux .jt-icon:hover{background:var(--jt-hover)}
#jt-ux .jt-primary,#jt-ux .jt-primary:hover{background:var(--jt-primary);border-color:var(--jt-primary);color:var(--jt-on-primary)}
#jt-ux .jt-quiet{border-color:transparent;background:transparent}
#jt-ux .jt-icon{width:32px;min-height:32px;padding:6px;flex-shrink:0}
#jt-ux .jt-play{color:var(--jt-primary);background:var(--jt-selected)}
#jt-ux .jt-pause{color:var(--jt-green);background:var(--jt-green-bg)}
#jt-ux .jt-danger{color:var(--jt-error)}
#jt-ux .jt-right{margin-left:auto}
#jt-ux .jt-count{font-size:12px;color:var(--jt-muted);font-weight:400}
#jt-ux .jt-main{padding:22px;min-height:610px}
#jt-ux .jt-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
#jt-ux .jt-sub{color:var(--jt-muted);font-size:12px}
#jt-ux .jt-subline{color:var(--jt-muted);margin-top:4px}
#jt-ux .jt-stack{display:flex;flex-direction:column;gap:4px;min-width:0}
#jt-ux .jt-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#jt-ux .jt-nowrap{flex-wrap:nowrap}
#jt-ux .jt-field{display:flex;flex-direction:column;gap:6px;min-width:0}
#jt-ux .jt-field&gt;span{font-size:12px;color:var(--jt-muted)}
#jt-ux input:not([type=checkbox]),#jt-ux select,#jt-ux textarea{border:1px solid var(--jt-line);background:var(--jt-surface);color:var(--jt-text);border-radius:7px;padding:8px 10px;min-width:0;max-width:100%;width:100%}
#jt-ux textarea{resize:vertical;min-height:80px}
#jt-ux input[type=checkbox]{accent-color:var(--jt-primary);width:16px;height:16px;margin:0;flex-shrink:0}
#jt-ux .jt-add{display:flex;gap:8px;margin-bottom:20px}
#jt-ux .jt-add input{flex:1}
#jt-ux .jt-work-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px}
#jt-ux .jt-section-head{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:12px}
#jt-ux .jt-task-list{background:var(--jt-surface);border:1px solid var(--jt-line);border-radius:9px;overflow:clip}
#jt-ux .jt-task{padding:12px 13px;border-bottom:1px solid var(--jt-line)}
#jt-ux .jt-task:last-child{border-bottom:0}
#jt-ux .jt-key{font-size:12px;color:var(--jt-muted);letter-spacing:.15px}
#jt-ux .jt-task-name{font-weight:500;margin:3px 0 9px;overflow-wrap:anywhere}
#jt-ux .jt-task-tools{display:flex;align-items:center;gap:4px}
#jt-ux .jt-task-tools .jt-button{font-size:12px;padding:5px 7px;min-height:30px}
#jt-ux .jt-mini{font-size:12px;padding:4px 7px;min-height:28px}
#jt-ux .jt-running-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--jt-green);margin-right:5px;vertical-align:middle}
#jt-ux .jt-checkbox-label{display:flex;align-items:center;gap:8px;min-width:0}
#jt-ux .jt-tabs-small{display:flex;gap:15px;border-bottom:1px solid var(--jt-line);margin-bottom:4px}
#jt-ux .jt-small-tab{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--jt-muted);padding:8px 0;font:inherit;font-size:13px}
#jt-ux .jt-small-tab[aria-selected=true]{color:var(--jt-text);border-color:var(--jt-primary);font-weight:500}
#jt-ux .jt-log{display:grid;grid-template-columns:17px minmax(0,1fr) auto;gap:11px;align-items:center;padding:var(--jt-pad) 9px;border-bottom:1px solid var(--jt-line);border-radius:6px}
#jt-ux .jt-log.jt-chosen{background:var(--jt-selected)}
#jt-ux .jt-log-name{font-weight:500;overflow-wrap:anywhere}
#jt-ux .jt-log-desc{font-size:12px;color:var(--jt-muted);margin-top:3px;overflow-wrap:anywhere}
#jt-ux .jt-log-end{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
#jt-ux .jt-time{font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:44px;text-align:right}
#jt-ux .jt-log.jt-running .jt-time{color:var(--jt-green)}
#jt-ux .jt-log-meta{display:flex;gap:7px;align-items:center;margin-bottom:3px;color:var(--jt-muted);font-size:11px;flex-wrap:wrap}
#jt-ux .jt-band{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;background:var(--jt-green-bg);color:var(--jt-green);border-radius:7px;margin-bottom:10px;font-size:12px}
#jt-ux .jt-band .jt-button{color:inherit}
#jt-ux .jt-footer{border-top:1px solid var(--jt-line);padding:15px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--jt-surface)}
#jt-ux .jt-footer input[type=date]{width:148px}
#jt-ux .jt-footer-summary{flex:1;min-width:170px}
#jt-ux .jt-footer-summary strong{font-variant-numeric:tabular-nums}
#jt-ux .jt-notice{background:var(--jt-hover);border-radius:7px;padding:10px 12px;font-size:12px;color:var(--jt-muted);margin-top:12px}
#jt-ux .jt-error{color:var(--jt-error);background:var(--jt-warn-bg);border-radius:7px;padding:10px 12px;margin-top:12px;font-size:12px}
#jt-ux .jt-success{background:var(--jt-green-bg);color:var(--jt-green);border-radius:8px;padding:12px 14px}
#jt-ux .jt-task-chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:22px}
#jt-ux .jt-task-chip{background:var(--jt-surface);border:1px solid var(--jt-line);border-radius:8px;padding:10px;min-width:0}
#jt-ux .jt-task-chip .jt-task-name{font-size:12px;min-height:34px}
#jt-ux .jt-group{border:1px solid var(--jt-line);background:var(--jt-surface);border-radius:9px;margin-bottom:12px;overflow:clip}
#jt-ux .jt-group-head{padding:12px 14px;display:flex;align-items:center;gap:9px;background:var(--jt-hover);flex-wrap:wrap}
#jt-ux .jt-group-body{padding:0 8px}
#jt-ux .jt-empty{padding:42px 18px;text-align:center;color:var(--jt-muted);display:flex;flex-direction:column;gap:12px;align-items:center}
#jt-ux .jt-day-top{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:16px;background:var(--jt-surface);border:1px solid var(--jt-line);border-radius:9px;margin-bottom:18px}
#jt-ux .jt-metric{display:flex;flex-direction:column;gap:4px}
#jt-ux .jt-metric&gt;span{font-size:12px;color:var(--jt-muted)}
#jt-ux .jt-metric&gt;strong{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
#jt-ux .jt-day-bound{display:flex;gap:4px;align-items:center}
#jt-ux .jt-day-bound input{width:92px;padding:6px}
#jt-ux .jt-track-wrap{margin-bottom:20px}
#jt-ux .jt-track{height:26px;display:flex;gap:2px;border-radius:5px;overflow:clip}
#jt-ux .jt-track-part{min-width:1px;height:100%;padding:0;border:0;border-radius:0}
#jt-ux .jt-track-part.jt-break-fill{background:var(--jt-break)}
#jt-ux .jt-track-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--jt-muted);margin-top:5px;font-variant-numeric:tabular-nums}
#jt-ux .jt-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:9px;color:var(--jt-muted);font-size:11px}
#jt-ux .jt-legend span{display:flex;align-items:center;gap:5px}
#jt-ux .jt-swatch{display:inline-block;width:8px;height:8px;border-radius:2px}
#jt-ux .jt-day-grid{display:grid;grid-template-columns:minmax(0,1fr) 208px;gap:24px}
#jt-ux .jt-day-list{background:var(--jt-surface);border:1px solid var(--jt-line);border-radius:9px;overflow:clip}
#jt-ux .jt-segment{border-bottom:1px solid var(--jt-line)}
#jt-ux .jt-segment:last-child{border-bottom:0}
#jt-ux .jt-segment-button{display:grid;grid-template-columns:58px minmax(0,1fr) 49px 18px;gap:10px;align-items:center;padding:12px;width:100%;border:0;background:transparent;color:var(--jt-text);text-align:left;white-space:normal;font-weight:400}
#jt-ux button.jt-segment-button:hover{background:var(--jt-hover)}
#jt-ux .jt-segment-time{font-size:12px;font-variant-numeric:tabular-nums}
#jt-ux .jt-segment-time span{display:block;color:var(--jt-muted);font-size:11px}
#jt-ux .jt-segment-title{font-size:13px;font-weight:500;overflow-wrap:anywhere}
#jt-ux .jt-segment-duration{text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
#jt-ux .jt-break-row{display:flex;align-items:center;gap:11px;padding:9px 12px;background:var(--jt-bg);font-size:12px;color:var(--jt-muted);border-bottom:1px solid var(--jt-line)}
#jt-ux .jt-break-row&gt;span:first-child{width:58px;font-variant-numeric:tabular-nums;font-size:11px}
#jt-ux .jt-source{padding:12px 0;border-bottom:1px solid var(--jt-line)}
#jt-ux .jt-source-durations{display:flex;align-items:center;gap:12px;margin:8px 0;font-variant-numeric:tabular-nums}
#jt-ux .jt-source-durations strong{font-size:18px}
#jt-ux .jt-source-durations span{color:var(--jt-muted)}
#jt-ux .jt-source label{font-size:11px;line-height:1.4;color:var(--jt-muted)}
#jt-ux .jt-edit{padding:14px;background:var(--jt-selected);border-top:1px solid var(--jt-line)}
#jt-ux .jt-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
#jt-ux .jt-settings{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
#jt-ux .jt-settings-section{background:var(--jt-surface);border:1px solid var(--jt-line);border-radius:9px;padding:18px}
#jt-ux .jt-settings-section h3{margin-bottom:18px}
#jt-ux .jt-settings-section&gt;.jt-field{margin-bottom:16px}
#jt-ux .jt-range{border-bottom:1px solid var(--jt-line);padding:12px 0}
#jt-ux .jt-range:first-of-type{padding-top:0}
#jt-ux .jt-range:last-child{border-bottom:0}
#jt-ux .jt-range-inputs{display:flex;align-items:center;gap:8px;margin-top:7px}
#jt-ux .jt-range-inputs input{width:100%;min-width:0}
#jt-ux .jt-overlay{position:absolute;inset:0;z-index:10;background:light-dark(#171b3333,#070a1499);display:flex;align-items:flex-start;justify-content:center;padding:78px 20px 20px}
#jt-ux .jt-dialog{width:460px;max-width:100%;background:var(--jt-surface);border:1px solid var(--jt-line);border-radius:12px;box-shadow:0 12px 45px light-dark(#171b331f,#00000066);padding:22px}
#jt-ux .jt-dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:8px}
#jt-ux .jt-dialog-head h3{font-size:19px}
#jt-ux .jt-dialog&gt;.jt-field{margin-bottom:15px}
#jt-ux .jt-dialog .jt-form-grid{margin-top:16px}
#jt-ux .jt-dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
#jt-ux .jt-toast{background:var(--jt-selected);color:var(--jt-primary);padding:9px 20px;border-bottom:1px solid var(--jt-line);font-size:12px}
#jt-ux .jt-status{font-size:11px;color:var(--jt-muted);margin-top:3px}
#jt-ux .jt-status.sent{color:var(--jt-green)}
#jt-ux .jt-status.failed,#jt-ux .jt-status.unknown{color:var(--jt-warn)}
#jt-ux .jt-compact .jt-task{padding:9px 11px}
@media(max-width:830px){
  #jt-ux .jt-work-grid{grid-template-columns:210px minmax(0,1fr);gap:15px}
  #jt-ux .jt-main{padding:18px}
  #jt-ux .jt-task-tools{flex-wrap:wrap}
  #jt-ux .jt-day-grid{grid-template-columns:minmax(0,1fr)}
  #jt-ux .jt-sources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:18px}
  #jt-ux .jt-sources&gt;h3{grid-column:1/-1}
}
@media(max-width:650px){
  #jt-ux .jt-work-grid,#jt-ux .jt-settings{grid-template-columns:minmax(0,1fr)}
  #jt-ux .jt-task-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:0;gap:8px;background:transparent;overflow:visible}
  #jt-ux .jt-task{border:1px solid var(--jt-line);border-radius:8px;background:var(--jt-surface)}
  #jt-ux .jt-task:last-child{border-bottom:1px solid var(--jt-line)}
  #jt-ux .jt-task-chips{grid-template-columns:repeat(2,minmax(0,1fr))}
  #jt-ux .jt-log{gap:8px;padding-left:4px;padding-right:4px}
  #jt-ux .jt-footer{padding:14px 18px}
  #jt-ux .jt-footer-summary{flex-basis:100%}
}
@media(max-width:410px){
  #jt-ux .jt-main{padding:14px}
  #jt-ux .jt-nav{padding:8px;gap:2px}
  #jt-ux .jt-tab{padding:6px 8px;font-size:13px}
  #jt-ux .jt-titlebar{padding:8px 11px}
  #jt-ux .jt-window-marks{display:none}
  #jt-ux .jt-task-list,#jt-ux .jt-task-chips{grid-template-columns:minmax(0,1fr)}
  #jt-ux .jt-add{flex-wrap:wrap}
  #jt-ux .jt-add input{flex-basis:100%}
  #jt-ux .jt-log{grid-template-columns:16px minmax(0,1fr)}
  #jt-ux .jt-log-end{grid-column:2;justify-content:flex-end}
  #jt-ux .jt-day-top{gap:16px}
  #jt-ux .jt-metric&gt;strong{font-size:18px}
  #jt-ux .jt-segment-button{grid-template-columns:47px minmax(0,1fr) 38px 16px;gap:6px;padding:10px}
  #jt-ux .jt-sources{grid-template-columns:minmax(0,1fr)}
  #jt-ux .jt-overlay{padding:54px 10px 10px}
  #jt-ux .jt-dialog{padding:17px}
  #jt-ux .jt-footer input[type=date]{width:143px}
  #jt-ux .jt-form-grid{gap:8px}
}
@media(pointer:coarse){#jt-ux button{min-height:44px}#jt-ux .jt-icon{min-width:44px}#jt-ux input:not([type=checkbox]),#jt-ux select,#jt-ux textarea{font-size:16px}}
&lt;/style&gt;
&lt;div id=&quot;jt-ux&quot; aria-label=&quot;Jira Time Tracker — концепция экранов&quot;&gt;
  &lt;div class=&quot;jt-titlebar&quot;&gt;Jira Time Tracker · Макет&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
(function(){
  const root=document.getElementById(&#x27;jt-ux&#x27;);
  const design={layout:&#x27;split&#x27;,density:&#x27;comfortable&#x27;,delivery:&#x27;success&#x27;};
  const ui={screen:&#x27;work&#x27;,tab:&#x27;queue&#x27;,date:&#x27;2026-09-14&#x27;,modal:null,toast:&#x27;&#x27;,batch:false,taskChecks:new Set(),edit:null,sending:false,settingsStatus:&#x27;&#x27;};
  const tasks=[
    {id:&#x27;ESP-248&#x27;,title:&#x27;Авторизация через SSO&#x27;},
    {id:&#x27;ESP-251&#x27;,title:&#x27;Экспорт отчёта в CSV&#x27;},
    {id:&#x27;ESP-239&#x27;,title:&#x27;Ускорить поиск по журналу&#x27;},
    {id:&#x27;ESP-233&#x27;,title:&#x27;Обработка ошибок API&#x27;},
    {id:&#x27;ESP-227&#x27;,title:&#x27;Инструкции по запуску&#x27;}
  ];
  let nextId=20, revision=0, day=null, renderedScreen=&#x27;work&#x27;;
  const now=Date.now();
  const logs=[
    {id:1,task:&#x27;ESP-248&#x27;,seconds:4680,started:now,description:&#x27;Настраиваю вход через провайдера&#x27;,date:&#x27;Сегодня&#x27;,source:&#x27;Таймер&#x27;},
    {id:2,task:&#x27;ESP-251&#x27;,seconds:2520,started:now,description:&#x27;Проверяю выгрузку больших отчётов&#x27;,date:&#x27;Сегодня&#x27;,source:&#x27;Таймер&#x27;},
    {id:3,task:&#x27;ESP-239&#x27;,seconds:10800,started:null,description:&#x27;Упростил запросы и добавил индекс&#x27;,date:&#x27;Сегодня&#x27;,source:&#x27;Вручную&#x27;},
    {id:4,task:&#x27;ESP-233&#x27;,seconds:4800,started:null,description:&#x27;Проверил таймауты и ответы сервера&#x27;,date:&#x27;Вчера&#x27;,source:&#x27;Таймер&#x27;},
    {id:5,task:&#x27;ESP-248&#x27;,seconds:3000,started:null,description:&#x27;Разобрал текущий поток входа&#x27;,date:&#x27;Вчера&#x27;,source:&#x27;Таймер&#x27;},
    {id:6,task:&#x27;ESP-227&#x27;,seconds:1800,started:null,description:&#x27;&#x27;,date:&#x27;11 сентября&#x27;,source:&#x27;Вручную&#x27;}
  ];
  const selected=new Set([3,4]), locks=new Set();
  const config={url:&#x27;https://esprowteam.atlassian.net&#x27;,email:&#x27;you@company.com&#x27;,token:&#x27;&#x27;};
  const esc=v=&gt;String(v).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
  const icon=n=&gt;&#x27;&lt;i data-lucide=&quot;&#x27;+n+&#x27;&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27;;
  const task=id=&gt;tasks.find(t=&gt;t.id===id);
  const elapsed=l=&gt;l.seconds+(l.started?Math.max(0,Math.floor((Date.now()-l.started)/1000)):0);
  const mins=l=&gt;Math.max(1,Math.round(elapsed(l)/60));
  const dur=m=&gt;Math.floor(m/60)+&#x27;:&#x27;+String(m%60).padStart(2,&#x27;0&#x27;);
  const hhmm=m=&gt;String(Math.floor(m/60)).padStart(2,&#x27;0&#x27;)+&#x27;:&#x27;+String(m%60).padStart(2,&#x27;0&#x27;);
  const readTime=s=&gt;{const p=String(s).split(&#x27;:&#x27;).map(Number);return p.length===2?p[0]*60+p[1]:NaN};
  const live=l=&gt;{const s=elapsed(l);return Math.floor(s/3600)+&#x27;:&#x27;+String(Math.floor(s/60)%60).padStart(2,&#x27;0&#x27;)+&#x27;:&#x27;+String(s%60).padStart(2,&#x27;0&#x27;)};
  const button=(text,act,extra,cls)=&gt;&#x27;&lt;button type=&quot;button&quot; class=&quot;jt-button &#x27;+(cls||&#x27;&#x27;)+&#x27;&quot; data-act=&quot;&#x27;+act+&#x27;&quot; &#x27;+(extra||&#x27;&#x27;)+&#x27;&gt;&#x27;+text+&#x27;&lt;/button&gt;&#x27;;
  const action=(ico,label,act,extra,cls)=&gt;&#x27;&lt;button type=&quot;button&quot; class=&quot;jt-icon &#x27;+(cls||&#x27;&#x27;)+&#x27;&quot; data-act=&quot;&#x27;+act+&#x27;&quot; aria-label=&quot;&#x27;+esc(label)+&#x27;&quot; &#x27;+(extra||&#x27;&#x27;)+&#x27;&gt;&#x27;+icon(ico)+&#x27;&lt;/button&gt;&#x27;;
  const stopped=()=&gt;logs.filter(l=&gt;!l.used&amp;&amp;!l.started&amp;&amp;!l.reserved);
  const chosen=()=&gt;logs.filter(l=&gt;selected.has(l.id)&amp;&amp;!l.used&amp;&amp;!l.started);
  function tell(s){ui.toast=s}
  function titlebar(){
    return &#x27;&lt;div class=&quot;jt-titlebar&quot;&gt;&lt;span class=&quot;jt-logo&quot;&gt;&#x27;+icon(&#x27;timer&#x27;)+&#x27;&lt;/span&gt;&lt;strong&gt;Jira Time Tracker&lt;/strong&gt;&lt;span class=&quot;jt-demo&quot;&gt;Макет&lt;/span&gt;&lt;span class=&quot;jt-window-marks&quot; aria-hidden=&quot;true&quot;&gt;− &amp;nbsp; □ &amp;nbsp; ×&lt;/span&gt;&lt;/div&gt;&#x27;+
    &#x27;&lt;nav class=&quot;jt-nav&quot; aria-label=&quot;Основные экраны&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;jt-tab&quot; data-act=&quot;work&quot; aria-selected=&quot;&#x27;+(ui.screen===&#x27;work&#x27;)+&#x27;&quot;&gt;&#x27;+icon(&#x27;layers&#x27;)+&#x27;Работа &lt;span class=&quot;jt-count&quot;&gt;&#x27;+logs.filter(l=&gt;!l.used).length+&#x27;&lt;/span&gt;&lt;/button&gt;&#x27;+
    &#x27;&lt;button type=&quot;button&quot; class=&quot;jt-tab&quot; data-act=&quot;day&quot; aria-selected=&quot;&#x27;+(ui.screen===&#x27;day&#x27;)+&#x27;&quot;&gt;&#x27;+icon(&#x27;calendar-days&#x27;)+&#x27;День&#x27;+(day?&#x27; &lt;span class=&quot;jt-count&quot;&gt;1&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/button&gt;&#x27;+
    &#x27;&lt;button type=&quot;button&quot; class=&quot;jt-tab jt-right&quot; data-act=&quot;settings&quot; aria-selected=&quot;&#x27;+(ui.screen===&#x27;settings&#x27;)+&#x27;&quot;&gt;&#x27;+icon(&#x27;settings-2&#x27;)+&#x27;Настройки&lt;/button&gt;&lt;/nav&gt;&#x27;+
    (ui.toast?&#x27;&lt;div class=&quot;jt-toast&quot; role=&quot;status&quot;&gt;&#x27;+esc(ui.toast)+&#x27;&lt;/div&gt;&#x27;:&#x27;&#x27;);
  }
  function taskTools(t){
    const running=logs.find(l=&gt;l.task===t.id&amp;&amp;l.started&amp;&amp;!l.used);
    return &#x27;&lt;div class=&quot;jt-task-tools&quot;&gt;&#x27;+action(running?&#x27;pause&#x27;:&#x27;play&#x27;,running?&#x27;Пауза &#x27;+t.id:&#x27;Запустить &#x27;+t.id,&#x27;timer&#x27;,&#x27;data-task=&quot;&#x27;+t.id+&#x27;&quot;&#x27;,running?&#x27;jt-pause&#x27;:&#x27;jt-play&#x27;)+
    button(&#x27;+ Время&#x27;,&#x27;manual&#x27;,&#x27;data-task=&quot;&#x27;+t.id+&#x27;&quot;&#x27;,&#x27;jt-quiet&#x27;)+
    action(&#x27;square-pen&#x27;,&#x27;Новый лог &#x27;+t.id,&#x27;newlog&#x27;,&#x27;data-task=&quot;&#x27;+t.id+&#x27;&quot;&#x27;)+&#x27;&lt;/div&gt;&#x27;;
  }
  function recent(chips){
    return tasks.slice(0,chips?3:5).map(t=&gt;&#x27;&lt;div class=&quot;&#x27;+(chips?&#x27;jt-task-chip&#x27;:&#x27;jt-task&#x27;)+&#x27;&quot;&gt;&#x27;+
    &#x27;&lt;div class=&quot;jt-row&quot;&gt;&lt;span class=&quot;jt-key&quot;&gt;&#x27;+t.id+&#x27;&lt;/span&gt;&#x27;+(ui.batch?&#x27;&lt;input type=&quot;checkbox&quot; class=&quot;jt-right&quot; data-change=&quot;taskcheck&quot; data-task=&quot;&#x27;+t.id+&#x27;&quot; aria-label=&quot;Выбрать задачу &#x27;+t.id+&#x27;&quot; &#x27;+(ui.taskChecks.has(t.id)?&#x27;checked&#x27;:&#x27;&#x27;)+&#x27;&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;+
    &#x27;&lt;div class=&quot;jt-task-name&quot;&gt;&#x27;+esc(t.title)+&#x27;&lt;/div&gt;&#x27;+taskTools(t)+&#x27;&lt;/div&gt;&#x27;).join(&#x27;&#x27;);
  }
  function logRow(l,grouped){
    const t=task(l.task);
    const state=l.started?&#x27;jt-running&#x27;:selected.has(l.id)?&#x27;jt-chosen&#x27;:&#x27;&#x27;;
    return &#x27;&lt;div class=&quot;jt-log &#x27;+state+&#x27;&quot;&gt;&#x27;+
    (l.used?&#x27;&lt;span style=&quot;color:var(--jt-green)&quot;&gt;&#x27;+icon(&#x27;check&#x27;)+&#x27;&lt;/span&gt;&#x27;:&#x27;&lt;input type=&quot;checkbox&quot; data-change=&quot;select&quot; data-id=&quot;&#x27;+l.id+&#x27;&quot; aria-label=&quot;Выбрать лог &#x27;+l.task+&#x27; &#x27;+esc(l.description||&#x27;без описания&#x27;)+&#x27;&quot; &#x27;+(selected.has(l.id)?&#x27;checked &#x27;:&#x27;&#x27;)+(l.started||l.reserved?&#x27;disabled&#x27;:&#x27;&#x27;)+&#x27;&gt;&#x27;)+
    &#x27;&lt;div class=&quot;jt-stack&quot;&gt;&lt;div class=&quot;jt-log-meta&quot;&gt;&lt;span&gt;&#x27;+l.task+&#x27;&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;&lt;span&gt;&#x27;+l.date+&#x27;&lt;/span&gt;&#x27;+(l.source===&#x27;Вручную&#x27;?&#x27;&lt;span&gt;· вручную&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;+
    &#x27;&lt;div class=&quot;jt-log-name&quot;&gt;&#x27;+esc(grouped?(l.description||&#x27;Без описания&#x27;):t.title)+&#x27;&lt;/div&gt;&#x27;+
    (!grouped&amp;&amp;l.description?&#x27;&lt;div class=&quot;jt-log-desc&quot;&gt;&#x27;+esc(l.description)+&#x27;&lt;/div&gt;&#x27;:&#x27;&#x27;)+
    (l.started?&#x27;&lt;div class=&quot;jt-status&quot;&gt;&lt;span class=&quot;jt-running-dot&quot;&gt;&lt;/span&gt;Таймер идёт&lt;/div&gt;&#x27;:l.reserved?&#x27;&lt;div class=&quot;jt-status&quot;&gt;В черновике дня&lt;/div&gt;&#x27;:l.used?&#x27;&lt;div class=&quot;jt-status sent&quot;&gt;Отправлено · &#x27;+ui.date+&#x27;&lt;/div&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;+
    &#x27;&lt;div class=&quot;jt-log-end&quot;&gt;&lt;span class=&quot;jt-time&quot; &#x27;+(l.started?&#x27;data-live=&quot;&#x27;+l.id+&#x27;&quot;&#x27;:&#x27;&#x27;)+&#x27;&gt;&#x27;+(l.started?live(l):dur(mins(l)))+&#x27;&lt;/span&gt;&#x27;+
    (!l.used?(l.started?action(&#x27;pause&#x27;,&#x27;Поставить лог на паузу&#x27;,&#x27;pause&#x27;,&#x27;data-id=&quot;&#x27;+l.id+&#x27;&quot;&#x27;,&#x27;jt-pause&#x27;):l.reserved?&#x27;&#x27;:action(&#x27;pencil&#x27;,&#x27;Изменить лог&#x27;,&#x27;editlog&#x27;,&#x27;data-id=&quot;&#x27;+l.id+&#x27;&quot;&#x27;)):&#x27;&#x27;)+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
  }
  function queueTabs(){
    return &#x27;&lt;div class=&quot;jt-tabs-small&quot; role=&quot;tablist&quot; aria-label=&quot;Логи&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;jt-small-tab&quot; role=&quot;tab&quot; aria-selected=&quot;&#x27;+(ui.tab===&#x27;queue&#x27;)+&#x27;&quot; data-act=&quot;queue&quot;&gt;Не отправлены &lt;span class=&quot;jt-count&quot;&gt;&#x27;+logs.filter(l=&gt;!l.used).length+&#x27;&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;jt-small-tab&quot; role=&quot;tab&quot; aria-selected=&quot;&#x27;+(ui.tab===&#x27;history&#x27;)+&#x27;&quot; data-act=&quot;history&quot;&gt;История&lt;/button&gt;&lt;/div&gt;&#x27;;
  }
  function logContent(grouped){
    const entries=logs.filter(l=&gt;ui.tab===&#x27;history&#x27;?l.used:!l.used);
    if(!entries.length)return &#x27;&lt;div class=&quot;jt-empty&quot;&gt;&lt;span&gt;&#x27;+icon(&#x27;check-check&#x27;)+&#x27;&lt;/span&gt;&lt;strong&gt;&#x27;+(ui.tab===&#x27;history&#x27;?&#x27;Здесь будут отправленные логи&#x27;:&#x27;Всё отправлено&#x27;)+&#x27;&lt;/strong&gt;&lt;span class=&quot;jt-sub&quot;&gt;Новые записи можно добавить вручную или таймером.&lt;/span&gt;&lt;/div&gt;&#x27;;
    if(grouped)return tasks.filter(t=&gt;entries.some(l=&gt;l.task===t.id)).map(t=&gt;&#x27;&lt;section class=&quot;jt-group&quot;&gt;&lt;div class=&quot;jt-group-head&quot;&gt;&lt;div class=&quot;jt-stack&quot;&gt;&lt;span class=&quot;jt-key&quot;&gt;&#x27;+t.id+&#x27;&lt;/span&gt;&lt;strong&gt;&#x27;+esc(t.title)+&#x27;&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;jt-right&quot;&gt;&#x27;+taskTools(t)+&#x27;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;jt-group-body&quot;&gt;&#x27;+entries.filter(l=&gt;l.task===t.id).map(l=&gt;logRow(l,true)).join(&#x27;&#x27;)+&#x27;&lt;/div&gt;&lt;/section&gt;&#x27;).join(&#x27;&#x27;);
    return entries.map(l=&gt;logRow(l,false)).join(&#x27;&#x27;);
  }
  function work(){
    const running=logs.filter(l=&gt;l.started&amp;&amp;!l.used);
    const toolbar=&#x27;&lt;div class=&quot;jt-section-head&quot;&gt;&lt;h3&gt;Логи&lt;/h3&gt;&#x27;+button(&#x27;Выбрать доступные&#x27;,&#x27;all&#x27;,&#x27;&#x27;,&#x27;jt-quiet jt-mini&#x27;)+&#x27;&lt;/div&gt;&#x27;+
    (running.length?&#x27;&lt;div class=&quot;jt-band&quot;&gt;&lt;span&gt;&lt;span class=&quot;jt-running-dot&quot;&gt;&lt;/span&gt;Работают &#x27;+running.length+&#x27; таймера&lt;/span&gt;&#x27;+button(&#x27;Пауза всем&#x27;,&#x27;pauseall&#x27;,&#x27;&#x27;,&#x27;jt-quiet jt-mini&#x27;)+&#x27;&lt;/div&gt;&#x27;:&#x27;&#x27;)+queueTabs();
    let body=&#x27;&#x27;;
    if(design.layout===&#x27;split&#x27;){
      body=&#x27;&lt;div class=&quot;jt-work-grid&quot;&gt;&lt;aside&gt;&lt;div class=&quot;jt-section-head&quot;&gt;&lt;h3&gt;Недавние задачи&lt;/h3&gt;&#x27;+button(ui.batch?&#x27;Готово&#x27;:&#x27;Выбрать&#x27;,&#x27;batch&#x27;,&#x27;&#x27;,&#x27;jt-quiet jt-mini&#x27;)+&#x27;&lt;/div&gt;&lt;div class=&quot;jt-task-list&quot;&gt;&#x27;+recent(false)+&#x27;&lt;/div&gt;&#x27;+
      (ui.batch?&#x27;&lt;div class=&quot;jt-row&quot; style=&quot;margin-top:10px&quot;&gt;&#x27;+button(&#x27;Запустить выбранные&#x27;,&#x27;batchstart&#x27;,ui.taskChecks.size?&#x27;&#x27;:&#x27;disabled&#x27;,&#x27;jt-primary&#x27;)+&#x27;&lt;/div&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/aside&gt;&lt;section&gt;&#x27;+toolbar+logContent(false)+&#x27;&lt;/section&gt;&lt;/div&gt;&#x27;;
    } else if(design.layout===&#x27;list&#x27;){
      body=&#x27;&lt;div class=&quot;jt-section-head&quot;&gt;&lt;h3&gt;Быстрые действия&lt;/h3&gt;&#x27;+button(&#x27;+ Записать время&#x27;,&#x27;manual&#x27;,&#x27;&#x27;,&#x27;jt-primary&#x27;)+&#x27;&lt;/div&gt;&lt;div class=&quot;jt-task-chips&quot;&gt;&#x27;+recent(true)+&#x27;&lt;/div&gt;&#x27;+toolbar+logContent(false);
    } else {
      body=&#x27;&lt;div class=&quot;jt-section-head&quot;&gt;&lt;h3&gt;Задачи и их логи&lt;/h3&gt;&#x27;+button(&#x27;+ Записать время&#x27;,&#x27;manual&#x27;,&#x27;&#x27;,&#x27;jt-primary&#x27;)+&#x27;&lt;/div&gt;&#x27;+toolbar+logContent(true);
    }
    const total=chosen().reduce((s,l)=&gt;s+mins(l),0);
    return &#x27;&lt;main class=&quot;jt-main&quot;&gt;&lt;div class=&quot;jt-heading&quot;&gt;&lt;div&gt;&lt;h2&gt;Работа&lt;/h2&gt;&lt;div class=&quot;jt-subline&quot;&gt;Записывайте время сейчас. Распределяйте по дням позже.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&#x27;+

  function settings(){

    return &#x27;&lt;main class=&quot;jt-main&quot;&gt;&lt;div class=&quot;jt-heading&quot;&gt;&lt;div&gt;&lt;h2&gt;Настройки&lt;/h2&gt;&lt;div class=&quot;jt-subline&quot;&gt;Подключение и привычный рабочий день&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;form data-form=&quot;settings&quot;&gt;&lt;div class=&quot;jt-settings&quot;&gt;&lt;section class=&quot;jt-settings-section&quot;&gt;&lt;h3&gt;&#x27;+icon(&#x27;plug&#x27;)+&#x27; Подключение к Jira&lt;/h3&gt;&lt;label class=&quot;jt-field&quot;&gt;&lt;span&gt;Адрес Jira&lt;/span&gt;&lt;input name=&quot;url&quot; type=&quot;url&quot; value=&quot;&#x27;+esc(config.url)+&#x27;&quot; required&gt;&lt;/label&gt;&lt;label class=&quot;jt-field&quot;&gt;&lt;span&gt;Email&lt;/span&gt;&lt;input name=&quot;email&quot; type=&quot;email&quot; value=&quot;&#x27;+esc(config.email)+&#x27;&quot; required&gt;&lt;/label&gt;&lt;label class=&quot;jt-field&quot;&gt;&lt;span&gt;API token&lt;/span&gt;&lt;input name=&quot;token&quot; type=&quot;password&quot; value=&quot;&#x27;+esc(config.token)+&#x27;&quot; placeholder=&quot;Введите токен&quot; autocomplete=&quot;off&quot;&gt;&lt;/label&gt;&lt;div class=&quot;jt-sub&quot; style=&quot;margin-bottom:14px&quot;&gt;Значения из окружения подставляются в поля. Сохранённые изменения имеют приоритет.&lt;/div&gt;&#x27;+button(&#x27;Проверить подключение&#x27;,&#x27;checkconnection&#x27;,&#x27;&#x27;,&#x27;&#x27;)+&#x27;&lt;div class=&quot;jt-status&quot; role=&quot;status&quot;&gt;&#x27;+esc(ui.settingsStatus)+&#x27;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;jt-settings-section&quot;&gt;&lt;h3&gt;&#x27;+icon(&#x27;calendar-clock&#x27;)+&#x27; Сборка дня&lt;/h3&gt;&#x27;+range(&#x27;Начало работы&#x27;,&#x27;08:00&#x27;,&#x27;09:00&#x27;)+range(&#x27;День вместе с паузами&#x27;,&#x27;07:30&#x27;,&#x27;08:00&#x27;)+range(&#x27;Начало обеда&#x27;,&#x27;12:00&#x27;,&#x27;14:00&#x27;)+range(&#x27;Обед, минут&#x27;,&#x27;30&#x27;,&#x27;45&#x27;,&#x27;number&#x27;)+range(&#x27;Коротких пауз&#x27;,&#x27;2&#x27;,&#x27;4&#x27;,&#x27;number&#x27;)+range(&#x27;Пауза, минут&#x27;,&#x27;5&#x27;,&#x27;10&#x27;,&#x27;number&#x27;)+&#x27;&lt;/section&gt;&lt;/div&gt;&lt;div class=&quot;jt-row&quot; style=&quot;margin-top:18px;justify-content:flex-end&quot;&gt;&#x27;+button(&#x27;Назад&#x27;,&#x27;work&#x27;,&#x27;&#x27;,&#x27;jt-quiet&#x27;)+&#x27;&lt;button type=&quot;button&quot; data-submit class=&quot;jt-button jt-primary&quot;&gt;Сохранить настройки&lt;/button&gt;&lt;/div&gt;&lt;/form&gt;&lt;/main&gt;&#x27;;
  }
  function modal(){
    if(!ui.modal)return &#x27;&#x27;;
    const m=ui.modal,l=m.log?logs.find(x=&gt;x.id===m.log):null,t=m.task||l?.task||tasks[0]?.id;
    const timer=m.kind===&#x27;timer&#x27;;
    return &#x27;&lt;div class=&quot;jt-overlay&quot;&gt;&lt;section class=&quot;jt-dialog&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;jt-dialog-title&quot;&gt;&lt;div class=&quot;jt-dialog-head&quot;&gt;&lt;h3 id=&quot;jt-dialog-title&quot;&gt;&#x27;+(timer?&#x27;Новый лог&#x27;:l?&#x27;Изменить лог&#x27;:&#x27;Добавить время&#x27;)+&#x27;&lt;/h3&gt;&#x27;+action(&#x27;x&#x27;,&#x27;Закрыть&#x27;,&#x27;close&#x27;)+&#x27;&lt;/div&gt;&lt;form data-form=&quot;manual&quot;&gt;&lt;label class=&quot;jt-field&quot;&gt;&lt;span&gt;Задача&lt;/span&gt;&lt;select name=&quot;task&quot; &#x27;+(l?&#x27;disabled&#x27;:&#x27;&#x27;)+&#x27;&gt;&#x27;+tasks.map(x=&gt;&#x27;&lt;option value=&quot;&#x27;+x.id+&#x27;&quot; &#x27;+(x.id===t?&#x27;selected&#x27;:&#x27;&#x27;)+&#x27;&gt;&#x27;+x.id+&#x27; · &#x27;+esc(x.title)+&#x27;&lt;/option&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/select&gt;&lt;/label&gt;&#x27;+
    (!timer?&#x27;&lt;div class=&quot;jt-form-grid&quot;&gt;&lt;label class=&quot;jt-field&quot;&gt;&lt;span&gt;Часы&lt;/span&gt;&lt;input name=&quot;hours&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;99&quot; value=&quot;&#x27;+(l?Math.floor(mins(l)/60):&#x27;&#x27;)+&#x27;&quot; placeholder=&quot;3&quot; required&gt;&lt;/label&gt;&lt;label class=&quot;jt-field&quot;&gt;&lt;span&gt;Минуты&lt;/span&gt;&lt;input name=&quot;minutes&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;59&quot; value=&quot;&#x27;+(l?mins(l)%60:0)+&#x27;&quot; required&gt;&lt;/label&gt;&lt;/div&gt;&#x27;:&#x27;&lt;div style=&quot;height:16px&quot;&gt;&lt;/div&gt;&#x27;)+
    &#x27;&lt;label class=&quot;jt-field&quot;&gt;&lt;span&gt;Что сделано &lt;span style=&quot;font-weight:400&quot;&gt;· необязательно&lt;/span&gt;&lt;/span&gt;&lt;textarea name=&quot;description&quot; placeholder=&quot;Кратко опишите результат&quot;&gt;&#x27;+esc(l?.description||&#x27;&#x27;)+&#x27;&lt;/textarea&gt;&lt;/label&gt;&lt;div class=&quot;jt-dialog-actions&quot;&gt;&#x27;+button(&#x27;Отмена&#x27;,&#x27;close&#x27;,&#x27;&#x27;,&#x27;jt-quiet&#x27;)+&#x27;&lt;button type=&quot;button&quot; data-submit class=&quot;jt-button jt-primary&quot;&gt;&#x27;+(timer?&#x27;Создать и запустить&#x27;:l?&#x27;Сохранить&#x27;:&#x27;Добавить лог&#x27;)+&#x27;&lt;/button&gt;&lt;/div&gt;&lt;/form&gt;&lt;/section&gt;&lt;/div&gt;&#x27;;
  }
  function render(){
    root.style.setProperty(&#x27;--jt-pad&#x27;,design.density===&#x27;compact&#x27;?&#x27;10px&#x27;:&#x27;14px&#x27;);
    root.innerHTML=titlebar()+(ui.screen===&#x27;work&#x27;?work():ui.screen===&#x27;day&#x27;?dayScreen():settings())+modal();
    if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
    if(renderedScreen!==ui.screen){renderedScreen=ui.screen;root.scrollIntoView({block:&#x27;start&#x27;})}
  }
  function pause(l){if(l&amp;&amp;l.started){l.seconds=elapsed(l);l.started=null}}
  function start(id){
    let l=logs.find(l=&gt;l.task===id&amp;&amp;l.started&amp;&amp;!l.used);
    if(l){pause(l);return}
    l=logs.find(l=&gt;l.task===id&amp;&amp;!l.used&amp;&amp;!l.reserved);
    if(!l){l={id:nextId++,task:id,seconds:0,description:&#x27;&#x27;,date:&#x27;Сегодня&#x27;,source:&#x27;Таймер&#x27;};logs.unshift(l)}
    l.started=Date.now();selected.delete(l.id);
  }
  function consume(){
    day.sources.forEach(src=&gt;{const parts=day.segments.filter(s=&gt;s.source===src.id);if(parts.length&amp;&amp;parts.every(s=&gt;s.status===&#x27;sent&#x27;)){const l=logs.find(l=&gt;l.id===src.id);l.used=true;l.reserved=false;selected.delete(l.id)}});
  }
  root.addEventListener(&#x27;click&#x27;,e=&gt;{
    const submit=e.target.closest(&#x27;[data-submit]&#x27;);if(submit){e.preventDefault();submitForm(submit.closest(&#x27;form&#x27;));return}
    const el=e.target.closest(&#x27;[data-act]&#x27;);if(!el||el.disabled)return;
    const act=el.dataset.act,id=Number(el.dataset.id),tid=el.dataset.task;
    ui.toast=&#x27;&#x27;;
    if([&#x27;work&#x27;,&#x27;day&#x27;,&#x27;settings&#x27;].includes(act)){ui.screen=act;ui.edit=null}
    if(act===&#x27;queue&#x27;||act===&#x27;history&#x27;)ui.tab=act;
    if(act===&#x27;batch&#x27;)ui.batch=!ui.batch;
    if(act===&#x27;batchstart&#x27;){ui.taskChecks.forEach(t=&gt;{if(!logs.some(l=&gt;l.task===t&amp;&amp;l.started))start(t)});ui.batch=false;ui.taskChecks.clear()}
    if(act===&#x27;timer&#x27;)start(tid);
    if(act===&#x27;pause&#x27;)pause(logs.find(l=&gt;l.id===id));
    if(act===&#x27;pauseall&#x27;)logs.forEach(pause);
    if(act===&#x27;manual&#x27;||act===&#x27;newlog&#x27;)ui.modal={kind:act===&#x27;newlog&#x27;?&#x27;timer&#x27;:&#x27;manual&#x27;,task:tid};
    if(act===&#x27;editlog&#x27;)ui.modal={kind:&#x27;manual&#x27;,log:id};
    if(act===&#x27;close&#x27;)ui.modal=null;
    if(act===&#x27;all&#x27;){stopped().forEach(l=&gt;selected.add(l.id))}
    if(act===&#x27;build&#x27;){build();return}
    if(act===&#x27;editsegment&#x27;){if(day&amp;&amp;!day.frozen)ui.edit=ui.edit===el.dataset.id?null:el.dataset.id}
    if(act===&#x27;canceledit&#x27;)ui.edit=null;
    if(act===&#x27;removesegment&#x27;){
      const segment=day.segments.find(s=&gt;s.id===el.dataset.id);day.segments=day.segments.filter(s=&gt;s.id!==el.dataset.id);
      if(!day.segments.some(s=&gt;s.source===segment.source)){const log=logs.find(l=&gt;l.id===segment.source);log.reserved=false;selected.delete(log.id);day.sources=day.sources.filter(l=&gt;l.id!==log.id)}
      ui.edit=null;
    }
    if(act===&#x27;checkconnection&#x27;){ui.settingsStatus=&#x27;В макете: подключение успешно. Реальный запрос не выполняется.&#x27;;tell(&#x27;Показан пример успешной проверки подключения.&#x27;)}
    if(act===&#x27;reconcile&#x27;){const s=day.segments.find(s=&gt;s.id===el.dataset.id);s.status=&#x27;sent&#x27;;consume();tell(&#x27;Запись найдена. Повторная отправка не нужна.&#x27;)}
    if(act===&#x27;send&#x27;&amp;&amp;day&amp;&amp;!validate()){
      ui.sending=true;day.frozen=true;render();
      setTimeout(()=&gt;{
        const pending=day.segments.filter(s=&gt;!s.existing&amp;&amp;s.status!==&#x27;sent&#x27;&amp;&amp;s.status!==&#x27;unknown&#x27;);
        pending.forEach((s,i)=&gt;{s.status=design.delivery===&#x27;partial&#x27;&amp;&amp;i&gt;=2?&#x27;failed&#x27;:design.delivery===&#x27;unknown&#x27;&amp;&amp;i===pending.length-1?&#x27;unknown&#x27;:&#x27;sent&#x27;});
        design.delivery=&#x27;success&#x27;;ui.sending=false;consume();render();
      },550);return;
    }
    render();
    if(ui.modal)setTimeout(()=&gt;root.querySelector(&#x27;.jt-dialog input[name=&quot;hours&quot;],.jt-dialog textarea&#x27;)?.focus(),0);
  });
  root.addEventListener(&#x27;change&#x27;,e=&gt;{
    const el=e.target,type=el.dataset.change,id=Number(el.dataset.id);
    if(type===&#x27;select&#x27;){el.checked?selected.add(id):selected.delete(id)}
    if(type===&#x27;taskcheck&#x27;){el.checked?ui.taskChecks.add(el.dataset.task):ui.taskChecks.delete(el.dataset.task)}
    if(type===&#x27;date&#x27;){ui.date=el.value;if(day)day.date=el.value}
    if(type===&#x27;lock&#x27;){el.checked?locks.add(id):locks.delete(id);tell(&#x27;Фиксация применяется при пересборке дня.&#x27;)}
    if(type===&#x27;startbound&#x27;)day.start=readTime(el.value);
    if(type===&#x27;endbound&#x27;)day.end=readTime(el.value);
    if(type)render();
  });
  function submitForm(form){
    if(!form.reportValidity())return;
    const data=new FormData(form),kind=form.dataset.form;
    if(kind===&#x27;add&#x27;){
      const raw=String(data.get(&#x27;issue&#x27;)).trim(),key=(raw.match(/[a-z][a-z0-9_]*-\d+/i)||[])[0]?.toUpperCase()||(/^\d+$/.test(raw)?&#x27;ESP-&#x27;+raw:null);
      if(!key){tell(&#x27;Введите ключ вроде ESP-248 или ссылку на задачу.&#x27;);render();return}
      if(tasks.some(t=&gt;t.id===key))tell(key+&#x27; уже есть в недавних задачах.&#x27;);
      else{tasks.unshift({id:key,title:&#x27;Новая задача · пример&#x27;});tell(key+&#x27; добавлена в макет. Можно запустить таймер или добавить время.&#x27;)}
    }
    if(kind===&#x27;manual&#x27;){
      const m=ui.modal,l=m.log?logs.find(l=&gt;l.id===m.log):null,tid=l?l.task:String(data.get(&#x27;task&#x27;)),description=String(data.get(&#x27;description&#x27;)||&#x27;&#x27;);
      if(m.kind===&#x27;timer&#x27;){
        logs.filter(l=&gt;l.task===tid).forEach(pause);logs.unshift({id:nextId++,task:tid,seconds:0,started:Date.now(),description,date:&#x27;Сегодня&#x27;,source:&#x27;Таймер&#x27;});
      } else{
        const minutes=Number(data.get(&#x27;hours&#x27;))*60+Number(data.get(&#x27;minutes&#x27;));
        if(minutes&lt;=0){form.querySelector(&#x27;[name=hours]&#x27;).setCustomValidity(&#x27;Укажите положительную длительность.&#x27;);form.reportValidity();form.querySelector(&#x27;[name=hours]&#x27;).setCustomValidity(&#x27;&#x27;);return}
        if(l){l.seconds=minutes*60;l.description=description}
        else logs.unshift({id:nextId++,task:tid,seconds:minutes*60,started:null,description,date:&#x27;Сегодня&#x27;,source:&#x27;Вручную&#x27;});
        tell(&#x27;Лог &#x27;+tid+&#x27; · &#x27;+dur(minutes)+&#x27; сохранён локально.&#x27;);
      }
      ui.modal=null;
    }
    if(kind===&#x27;segment&#x27;){
      const s=day.segments.find(s=&gt;s.id===form.dataset.id),duration=readTime(data.get(&#x27;duration&#x27;));
      if(!Number.isFinite(duration)||duration&lt;=0){form.querySelector(&#x27;[name=duration]&#x27;).setCustomValidity(&#x27;Введите длительность, например 1:20.&#x27;);form.reportValidity();form.querySelector(&#x27;[name=duration]&#x27;).setCustomValidity(&#x27;&#x27;);return}
      s.start=readTime(data.get(&#x27;start&#x27;));s.duration=duration;s.description=String(data.get(&#x27;description&#x27;));ui.edit=null;
    }
    if(kind===&#x27;settings&#x27;){config.url=String(data.get(&#x27;url&#x27;));config.email=String(data.get(&#x27;email&#x27;));config.token=String(data.get(&#x27;token&#x27;));tell(&#x27;Настройки изменены в макете.&#x27;);ui.screen=&#x27;work&#x27;}
    render();
  }
  root.addEventListener(&#x27;submit&#x27;,e=&gt;{e.preventDefault();submitForm(e.target)});
  root.addEventListener(&#x27;keydown&#x27;,e=&gt;{
    if(e.key===&#x27;Escape&#x27;&amp;&amp;ui.modal){ui.modal=null;render()}
    if(e.key===&#x27;Enter&#x27;&amp;&amp;e.target.tagName===&#x27;INPUT&#x27;&amp;&amp;e.target.form){e.preventDefault();submitForm(e.target.form)}
  });
  render();
  setInterval(()=&gt;{root.querySelectorAll(&#x27;[data-live]&#x27;).forEach(el=&gt;{const l=logs.find(l=&gt;l.id===Number(el.dataset.live));if(l&amp;&amp;l.started)el.textContent=live(l)})},1000);
  if(globalThis.Tweak){
    const tweak=new Tweak({container:root,onChange:render});
    tweak.addSelect(design,&#x27;layout&#x27;,{label:&#x27;Компоновка «Работы»&#x27;,options:[{label:&#x27;Две колонки — рекомендую&#x27;,value:&#x27;split&#x27;},{label:&#x27;Логи на первом месте&#x27;,value:&#x27;list&#x27;},{label:&#x27;Группы по задачам&#x27;,value:&#x27;groups&#x27;}]});
    tweak.addSelect(design,&#x27;density&#x27;,{label:&#x27;Плотность&#x27;,options:[{label:&#x27;Обычная&#x27;,value:&#x27;comfortable&#x27;},{label:&#x27;Компактная&#x27;,value:&#x27;compact&#x27;}]});
    tweak.addSelect(design,&#x27;delivery&#x27;,{label:&#x27;Пример результата отправки&#x27;,options:[{label:&#x27;Всё успешно&#x27;,value:&#x27;success&#x27;},{label:&#x27;Часть записей с ошибкой&#x27;,value:&#x27;partial&#x27;},{label:&#x27;Потерян ответ Jira&#x27;,value:&#x27;unknown&#x27;}]});
  }
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)

    }

  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },

      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
